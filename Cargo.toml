[package]
name = "washtank"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
lsp-types = "0.97.0"
oelung = { path = "../oelung" }
oelung-lantern = { path = "../oelung-lantern" }
ouroboros = "0.18.5"
regex = "1.12.2"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
smallvec = { version = "2.0.0-alpha.12" }
smol_str = "0.3.4"
squalid = { git = "https://github.com/helixbass/squalid", rev = "646f6bf" }
tokio = { version = "1.48.0", features = ["full", "fs"] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
tree-sitter = "0.26.3"
tree-sitter-highlight = "0.26.3"
tree-sitter-rust = "0.24.0"

[dev-dependencies]
indoc = "2.0.7"
vt100 = "0.16.2"
